kind = "web"
previewPath = "/"
title = "مجاهد للتجارة"
version = "1.0.0"
id = "artifacts/mujahid-trading"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21740

[services.development]
run = "pnpm --filter @workspace/mujahid-trading run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mujahid-trading", "run", "build" ]
publicDir = "artifacts/mujahid-trading/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21740"
BASE_PATH = "/"
